name: CI

# Checks the repository on each push to main and each pull request.
# The build jobs skip their steps until the repository has a build.zig.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The macOS and Windows jobs run every 6 hours on main; pull requests
  # and pushes run the quick Linux jobs only.
  schedule:
    - cron: "41 */6 * * *"

permissions:
  contents: read

# A new push to a pull request cancels the run of its old commit. Runs
# on main do not cancel each other: each one completes and saves the Zig
# cache. A scheduled run has a group of its own, so a push to main does
# not cancel the full run.
concurrency:
  group: ci-${{ github.event_name == 'schedule' && 'schedule' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ZIG_VERSION: "0.17.0"

jobs:
  # Which parts of the repository changed: a pull request that touches
  # only docs and site files skips the build and test jobs of the code.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.f.outputs.code }}
      docs: ${{ steps.f.outputs.docs }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - id: f
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then
            echo code=true >> "$GITHUB_OUTPUT"; echo docs=true >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD)
          printf '%s\n' "$files"
          docs_re='^(docs/|README\.md|CHANGELOG\.md|WRITING\.md|AGENTS\.md|tools/build-docs\.py|tools/shots\.sh|licenses/)'
          if printf '%s\n' "$files" | grep -qvE "$docs_re"; then code=true; else code=false; fi
          if printf '%s\n' "$files" | grep -qE "$docs_re"; then docs=true; else docs=false; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"; echo "docs=$docs" >> "$GITHUB_OUTPUT"

  check:
    name: Repository check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: sh tools/check-repo.sh

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r tools/docs-requirements.txt
      - run: python tools/build-docs.py site

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # The tests use Linux interfaces. The cross job builds the other systems.
    name: Test (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Report a skip
        if: hashFiles('build.zig') == ''
        run: echo "::notice::The repository has no build.zig. The build and the tests are skipped."
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        if: hashFiles('build.zig') != ''
        with:
          version: ${{ env.ZIG_VERSION }}
      # The Vulkan renderer needs glslc on Linux.
      - name: Install the Linux build dependencies
        if: hashFiles('build.zig') != '' && runner.os == 'Linux'
        run: |
          if grep -qE 'glslc' build.zig; then
            sudo apt-get update
            sudo apt-get install -y glslc
          fi
      # ulimit -v is enforced on Linux only.
      - name: Build and test
        if: hashFiles('build.zig') != ''
        run: |
          if [ "$RUNNER_OS" = Linux ]; then ulimit -v 6000000; fi
          zig build install test
      - name: Load the Vulkan driver in a static build
        # The static (musl) program opens the Vulkan loader and lavapipe
        # with the ELF loader of src/sys/elf. A failure to load prints its
        # reason in the SKIP line of the Vulkan tests.
        if: hashFiles('build.zig') != '' && runner.os == 'Linux'
        timeout-minutes: 30
        run: |
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1 gdb
          timeout 600 zig build test -Dtarget=x86_64-linux-musl -Dtest-filter=elf --summary all
          sh tests/static-vulkan.sh
      - name: Run a script
        if: hashFiles('build.zig') != ''
        run: |
          if [ "$RUNNER_OS" = Linux ]; then ulimit -v 6000000; fi
          printf 'puts [expr {6 * 7}]\n' > "$RUNNER_TEMP/t.tcl"
          test "$(zig build run -- --headless "$RUNNER_TEMP/t.tcl" | tr -d '\r')" = 42
      - name: Run a bundled app headless
        if: hashFiles('build.zig') != '' && runner.os == 'Linux'
        run: sh tests/bundle-headless.sh
      - name: Test the D-Bus client on a private bus
        if: hashFiles('build.zig') != '' && runner.os == 'Linux'
        run: sh tests/dbus.sh
      - name: Test the X11 client on Xvfb
        if: hashFiles('build.zig') != '' && runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          sudo apt-get install -y xvfb xdotool x11-utils
          sh tests/x11-input.sh
          sh tests/x11-icon.sh
      - name: Test the window icon on Wayland
        if: hashFiles('build.zig') != '' && runner.os == 'Linux'
        timeout-minutes: 5
        run: sh tests/wayland-icon.sh

  test-arm:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # The ELF loader on AArch64: a static (musl) build loads the TLS test
    # library, libz, libstdc++, the Vulkan loader, and lavapipe.
    name: Test (Linux AArch64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Install the build dependencies and the Vulkan driver
        run: |
          sudo apt-get update
          sudo apt-get install -y glslc mesa-vulkan-drivers libvulkan1 gdb
      - name: Test the ELF loader and the Vulkan renderer in a static build
        run: |
          timeout 900 sh tests/elf-tls.sh
          sh tests/static-vulkan.sh

  test-macos:
    # The core, the headless backend, and the AppKit backend with Metal on
    # macOS. The runner has a desktop session, so the window tests run.
    name: Test (macOS)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    env:
      ZTK_TEST_WINDOWS: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Build and test
        run: |
          zig build
          zig build test
      - name: Run a script
        run: |
          printf 'puts [expr {6 * 7}]\n' > "$RUNNER_TEMP/t.tcl"
          test "$(zig build run -- --headless "$RUNNER_TEMP/t.tcl" | tr -d '\r')" = 42
      - name: Run the demo in a window
        # The first frame ends the run. The alarm stops a run that hangs.
        run: perl -e 'alarm 120; exec @ARGV' zig-out/bin/ztk --exit-after-frames 1 examples/demo.tcl
      - name: Run a bundled app
        # The app runs its main script, and a flag is an argument of the
        # script, so it adds no capability.
        run: |
          printf 'puts "args: $argv"\nexit 0\n' > "$RUNNER_TEMP/hello.tcl"
          zig-out/bin/ztk bundle -o "$RUNNER_TEMP/Hello.app" --icon tests/golden/box-plain.png "$RUNNER_TEMP/hello.tcl"
          codesign --verify --strict "$RUNNER_TEMP/Hello.app"
          out=$(perl -e 'alarm 60; exec @ARGV' "$RUNNER_TEMP/Hello.app/Contents/MacOS/Hello" --allow exec)
          test "$out" = "args: --allow exec"

  cross-macos-run:
    # A macOS ztk from Linux, with the AppKit backend linked through the
    # text stubs, opens a window on the macOS runner.
    name: Cross-build for macOS
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Build on Linux
        run: zig build -Dtarget=aarch64-macos -Doptimize=ReleaseFast -Dbackends=appkit,headless -Dvulkan=false -Dstrip=true
      - name: Make a signed app on Linux
        # The Linux ztk writes the app folder and its ad hoc signature (machosign.zig).
        run: |
          zig build -Dbackends=headless -Dvulkan=false -p linux
          linux/bin/ztk bundle -o Demo.app --target aarch64-macos --runner zig-out/bin/ztk examples/demo.tcl examples/demo.css
          tar cf zig-out/bin/Demo.app.tar Demo.app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ztk-aarch64-macos-cross
          path: |
            zig-out/bin/ztk
            zig-out/bin/Demo.app.tar

  cross-macos-window:
    name: Show a window of the cross build (macOS)
    needs: cross-macos-run
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ztk-aarch64-macos-cross
          path: cross
      - name: Open a window and take a snapshot
        run: |
          chmod +x cross/ztk
          mkdir -p shots
          perl -e 'alarm 120; exec @ARGV' cross/ztk tests/window-shot.tcl shots/snapshot.png 8000 &
          sleep 5
          screencapture -x shots/screen.png || true
          wait $!
          test -s shots/snapshot.png
      - name: Check the signature of the app from Linux
        run: |
          tar xf cross/Demo.app.tar
          codesign --verify --deep --strict --verbose=2 Demo.app
          codesign -d --entitlements - Demo.app | grep -q allow-jit
          plutil -lint Demo.app/Contents/Info.plist
      - name: Draw frames of the demo with Metal
        # As in the native job: the run ends after 3 frames that AppKit and Metal presented.
        run: perl -e 'alarm 120; exec @ARGV' cross/ztk --exit-after-frames 3 examples/demo.tcl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cross-macos-window
          path: shots

  test-windows:
    # The core and the headless backend on Windows, as on macOS.
    name: Test (Windows)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    env:
      # The tests of the Win32 backend make hidden windows.
      ZTK_TEST_WINDOWS: "1"
      # The clipboard of the runner has no data of a person, so the clipboard test can change it.
      ZTK_TEST_CLIPBOARD: "1"
      # The tray test shows an icon in the notification area of the runner.
      ZTK_TEST_TRAY: "1"
    defaults:
      run:
        shell: bash
    steps:
      # The golden files and the scripts keep their LF line ends.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Build and test
        run: |
          zig build
          zig build test
      - name: Run a script
        run: |
          printf 'puts [expr {6 * 7}]\n' > "$RUNNER_TEMP/t.tcl"
          test "$(zig build run -- --headless "$RUNNER_TEMP/t.tcl" | tr -d '\r')" = 42
      - name: Read and write a file, and refuse an unknown capability
        run: |
          printf 'set f [open out.txt w]; puts $f hi; close $f; set f [open out.txt]; puts [read -nonewline $f]; close $f\n' > "$RUNNER_TEMP/f.tcl"
          ztk="$PWD/zig-out/bin/ztk"
          cd "$RUNNER_TEMP"
          test "$("$ztk" --headless f.tcl | tr -d '\r')" = hi
          test -f out.txt
          mkdir root
          "$ztk" --headless --root root f.tcl
          test -f root/out.txt
          if "$ztk" --headless --allow nonsense f.tcl; then exit 1; fi

  cross:
    name: Bundle (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # Builds the runtime of a target with `zig build runtimes`, bundles a
    # script for it with the Linux ztk, and checks that the bundle has the
    # full GUI backend of its platform (tests/bundle-backends.sh).
    # Pull requests and pushes check one target of each platform. The
    # scheduled run checks all six targets.
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["x86_64-linux","aarch64-linux","x86_64-macos","aarch64-macos","x86_64-windows","aarch64-windows"]' || '["x86_64-linux","aarch64-macos","x86_64-windows"]') }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        if: hashFiles('build.zig') != ''
        with:
          version: ${{ env.ZIG_VERSION }}
      # The Vulkan renderer of a Linux runtime needs glslc.
      - name: Install the Linux build dependencies
        if: hashFiles('build.zig') != '' && endsWith(matrix.target, '-linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y glslc
      - name: Build the runtime and a Linux ztk
        if: hashFiles('build.zig') != ''
        run: zig build install runtimes -Dbackends=headless -Dvulkan=false -Druntime-targets=${{ matrix.target }}
      - name: Check the backends of the bundles
        if: hashFiles('build.zig') != ''
        run: sh tests/bundle-backends.sh zig-out/bin/ztk ${{ matrix.target }}

  wasm:
    name: WebAssembly
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Report a skip
        if: hashFiles('build.zig') == ''
        run: echo "::notice::The repository has no build.zig. The wasm build is skipped."
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        if: hashFiles('build.zig') != ''
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Build the wasm step
        if: hashFiles('build.zig') != ''
        run: |
          if zig build -l | grep -qE '^[[:space:]]+wasm([[:space:]]|$)'; then
            zig build wasm
          else
            echo "::notice::The build has no wasm step. The wasm build is skipped."
          fi

  famous-apps:
    # The famous Tcl/Tk apps of tests/apps, each with a script of real
    # interactions on the headless backend: the widget demo of Tk, tkcon,
    # BWidget, Tablelist, tklib, and gitk. git runs the commits of gitk.
    name: Famous apps
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Install the build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y glslc
      - name: Build
        run: zig build
      - name: Run the apps
        run: tests/famous-apps.sh

  # A failure of the scheduled full run opens an issue, so it is fixed
  # in the next batch of work.
  report:
    name: Report a failure of the full run
    if: failure() && github.event_name == 'schedule'
    needs: [check, docs, test, test-macos, cross-macos-window, test-windows, cross, wasm, famous-apps]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open an issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create -R "${{ github.repository }}" \
            --title "The full CI run failed on $(date -u +%Y-%m-%d)" \
            --body "The scheduled full run failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # The one check for the merge: it passes when each job of the run
  # passed or was skipped, and fails when a job failed or was
  # cancelled.
  linux-ok:
    name: Linux ok
    if: always()
    needs: [changes, check, docs, test, test-arm, cross, wasm]
    runs-on: ubuntu-latest
    steps:
      - name: Check the results of the jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            case $r in success|skipped) ;; *) exit 1 ;; esac
          done
