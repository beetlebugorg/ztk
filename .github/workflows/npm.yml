name: npm

# Builds and tests the npm package. On a pull request and on main, the
# job ends with `npm publish --dry-run`. On a version tag, it publishes
# the package to npmjs.com. See docs/npm.md.
#
# The publish uses npm trusted publishing: GitHub Actions gives npm an
# OIDC token (id-token: write), and npm adds a provenance statement.
# The NPM_TOKEN secret is a fallback for a package that has no trusted
# publisher yet, for example the first publish.
on:
  push:
    branches: [main]
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-alpha"
      - "v[0-9]+.[0-9]+.[0-9]+-beta"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  ZIG_VERSION: "0.16.0"

jobs:
  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: zig build wasm
      - name: Put the package files in zig-out/npm
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            node npm/build.mjs --version "$GITHUB_REF_NAME"
          else
            node npm/build.mjs
          fi
      # The browser tests use the Chrome of the runner.
      - name: Test the package in Node.js, Vite, and a page with no build
        env:
          CHROME: /usr/bin/google-chrome
        run: node npm/test/run.mjs node browser cdn
      - name: Check the package with a dry run
        working-directory: zig-out/npm
        run: |
          npm pack --dry-run
          npm publish --dry-run --access public --tag latest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: zig-out/npm

  publish:
    name: Publish
    needs: package
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: package
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@^11.5.1
      # Each v0 version goes to the "latest" dist-tag, also an -alpha or
      # -beta version. npm needs --tag for a prerelease version.
      - name: Publish
        working-directory: package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public --tag latest
