name: npm

# Builds and tests the npm package. On a pull request and on main, the
# job ends with `npm publish --dry-run`. On a version tag, it publishes
# the package to npmjs.com. See docs/dev/npm.md.
#
# The publish uses npm trusted publishing: GitHub Actions gives npm an
# OIDC token (id-token: write), and npm adds a provenance statement.
# The job has no token and no registry-url: an .npmrc with an empty token
# stops npm from asking GitHub for the OIDC token. To publish a tag again,
# run the workflow on main with the input tag.
on:
  push:
    branches: [main]
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-alpha"
      - "v[0-9]+.[0-9]+.[0-9]+-beta"
      - "v[0-9]+.[0-9]+.[0-9]+-alpha.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "A version tag to package and publish again (it must exist)"
        required: false

permissions:
  contents: read

concurrency:
  group: npm-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  ZIG_VERSION: "0.17.0"

jobs:
  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: zig build wasm
      - name: Put the package files in zig-out/npm
        env:
          TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          if [ -n "$TAG" ]; then
            node npm/build.mjs --version "$TAG"
          else
            node npm/build.mjs
          fi
      # The browser tests use the Chrome of the runner.
      - name: Test the package in Node.js, Vite, and a page with no build
        env:
          CHROME: /usr/bin/google-chrome
        run: node npm/test/run.mjs node browser cdn
      - name: Check the package with a dry run
        working-directory: zig-out/npm
        run: |
          npm pack --dry-run
          npm publish --dry-run --access public --tag latest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: zig-out/npm

  publish:
    name: Publish
    needs: package
    if: github.ref_type == 'tag' || inputs.tag != ''
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: package
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      # Staged publishing needs npm 11.20 or later.
      - run: npm install -g npm@^11.20.0
      # Each v0 version goes to the "latest" dist-tag, also an -alpha or
      # -beta version. npm needs --tag for a prerelease version.
      - name: Publish
        working-directory: package
        run: npm stage publish --provenance --access public --tag latest
