name: release

# Makes a GitHub release for a version tag. See docs/dev/release.md.
#
# The files of a release (VERSION is the tag with no v):
#   ztk-VERSION-{x86_64,aarch64}-linux-musl.tar.gz
#   ztk-VERSION-{x86_64,aarch64}-macos.tar.gz
#   ztk-VERSION-x86_64-windows.zip
#   SHA256SUMS
#
# vX.Y.Z is a release. vX.Y.Z-alpha and vX.Y.Z-beta are prereleases.
# All three forms update the Homebrew tap.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-alpha"
      - "v[0-9]+.[0-9]+.[0-9]+-beta"
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag to release (it must exist)"
        required: true

permissions:
  contents: read

env:
  ZIG_VERSION: "0.17.0"
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.TAG }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Check the tag
        run: |
          echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-alpha|-beta)?$'
      - name: Install the Linux build dependencies
        run: |
          if grep -qE 'glslc' build.zig; then
            sudo apt-get update
            sudo apt-get install -y glslc
          fi
      - name: Test
        run: |
          ulimit -v 6000000
          zig build test
      - name: Build
        run: tools/release-build.sh "${TAG#v}" dist
      - name: Check the Linux binary
        run: |
          set -eu
          name="ztk-${TAG#v}-x86_64-linux-musl"
          tar -xzf "dist/$name.tar.gz" -C "$RUNNER_TEMP"
          printf 'puts [expr {6 * 7}]\n' > "$RUNNER_TEMP/t.tcl"
          test "$("$RUNNER_TEMP/$name/ztk" --headless "$RUNNER_TEMP/t.tcl")" = 42
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/*

  publish:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          (cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS) | tee -a "$GITHUB_STEP_SUMMARY"
          case "$TAG" in *-*) pre=--prerelease ;; *) pre= ;; esac
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --title "ztk $TAG" --generate-notes $pre
          fi

  # Without the token, the release stays and the tap keeps its version.
  homebrew:
    name: Homebrew tap
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Update the tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -eu
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set: the tap is not updated"
            exit 0
          fi
          v="${TAG#v}"
          git clone --depth 1 "https://x-access-token:$TAP_TOKEN@github.com/$OWNER/homebrew-tap" "$RUNNER_TEMP/tap"
          sh packaging/homebrew/tap.sh "$v" dist "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/ztk.rb
          git diff --cached --quiet || git commit -m "ztk $v"
          git push
