<!doctype html>

<!-- The size check of tests/site.sh. It opens the playground with each
     example and then the landing page, one at a time, in a frame with the
     size of the browser window. It collects the CSS size, the backing
     store size, and the first image of each canvas, and writes them as
     JSON into the element "result". The color scheme is the one of the browser. -->
<meta charset="utf-8">
<style>body { margin: 0; } iframe { width: 100vw; height: 100vh; border: 0; display: block; }</style>
<script type="module">
const examples = ["gallery", "demo", "signin", "calculator", "settings", "dashboard", "spreadsheet", "vector"];
const out = { play: {}, cards: null };
const wait = (f) => new Promise((res) => {
  const t0 = performance.now();
  const poll = () => {
    const v = f();
    if (v != null || performance.now() - t0 > 90000) res(v); else setTimeout(poll, 100);
  };
  poll();
});
const open = async (src) => {
  const f = document.createElement("iframe");
  f.src = src;
  document.body.replaceChildren(f);
  const text = await wait(() => f.contentDocument?.getElementById("result")?.textContent ?? null);
  return text == null ? null : JSON.parse(text);
};
for (const name of examples) {
  const r = await open(`play/index.html?example=${name}&test=1&probe`);
  out.play[name] = r ? r.probe : null;
}
const c = await open(`index.html?livetest`);
out.cards = c ? { geom: c.geom, png: c.png } : null;
const pre = document.createElement("pre");
pre.id = "result";
pre.textContent = JSON.stringify(out);
document.body.replaceChildren(pre);
</script>
